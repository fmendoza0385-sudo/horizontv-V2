name: Compilar HorizonTV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "No se encontró ANDROID_HOME ni ANDROID_SDK_ROOT en el runner."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "No se encontró sdkmanager; se continuará con el Android SDK preinstalado del runner."
          fi

      - name: Localizar proyecto Android
        id: project
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "No se encontró settings.gradle ni settings.gradle.kts. Verifica que hayas subido el proyecto Android completo."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto Android localizado en: $PROJECT_DIR"

      - name: Compilar HorizonTV
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug
          else
            echo "No existe gradlew en $PROJECT_DIR; se utilizará Gradle 8.9 instalado en el runner."
            gradle --no-daemon clean assembleDebug
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: HorizonTV-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
